<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tech Recruitment desde cero — 3ª edición · Fátima Leotta</title>
<link rel="icon" href="logomark-core.svg" />
<link rel="stylesheet" href="landing.css" />
<script src="https://unpkg.com/lucide@0.314.0/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="tweaks-panel.jsx" data-presets="react"></script>
<script type="text/babel" src="sections-top.jsx" data-presets="react"></script>
<script type="text/babel" src="sections-mid.jsx" data-presets="react"></script>
<script type="text/babel" src="sections-prog.jsx" data-presets="react"></script>
<script type="text/babel" src="sections-end.jsx" data-presets="react"></script>

<script type="text/babel" data-presets="react">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "#370068",
  "heroStyle": "galaxy",
  "showCountdown": true,
  "heroSize": 1.15,
  "ctaLabel": "Inscribirme"
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  React.useEffect(() => {
    if (window.lucide) window.lucide.createIcons();
  });

  React.useEffect(() => {
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) e.target.classList.add("in"); });
    }, { threshold: 0.12 });
    const els = document.querySelectorAll(".reveal:not(.in)");
    els.forEach(el => obs.observe(el));
    return () => obs.disconnect();
  });

  return (
    <div style={{ "--accent": t.accent }}>
      <Nav t={t} />
      <Hero t={t} />
      <Pains />
      <Edicion />
      <Resultados />
      <ParaQuien />
      <Programa />
      <Modalidad />
      <Incluye />
      <PorQue />
      <Testimonios />
      <SobreMi />
      <Inversion t={t} />
      <Faq />
      <CtaFinal t={t} />
      <Footer />
      <StickyWA />

      <TweaksPanel title="Tweaks">
        <TweakSection label="Marca" />
        <TweakColor label="Acento" value={t.accent}
          options={["#370068", "#701B79", "#5A2C8A"]}
          onChange={(v) => setTweak("accent", v)} />
        <TweakSection label="Hero" />
        <TweakRadio label="Fondo" value={t.heroStyle}
          options={["galaxy", "gradient", "light"]}
          onChange={(v) => setTweak("heroStyle", v)} />
        <TweakSlider label="Tamaño título" value={t.heroSize} min={0.85} max={1.15} step={0.05}
          onChange={(v) => setTweak("heroSize", v)} />
        <TweakSection label="Inscripción" />
        <TweakToggle label="Mostrar countdown" value={t.showCountdown}
          onChange={(v) => setTweak("showCountdown", v)} />
        <TweakText label="Texto del botón" value={t.ctaLabel}
          onChange={(v) => setTweak("ctaLabel", v)} />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<template id="__bundler_thumbnail">
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <rect width="100" height="100" fill="#101112"/>
  <text x="50" y="58" font-family="Georgia, serif" font-size="34" fill="#FDFDFD" text-anchor="middle">
    <tspan fill="#701B79">&lt;</tspan>fL<tspan fill="#701B79">&gt;</tspan>
  </text>
</svg>
</template>
</body>
</html>
